  <!-- Force external PMR links (the "PMR" button) to navigate the top window. This fixes cases where the app is embedded in an iframe. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        document.querySelectorAll('a[href^="https://www.postmillenniumrenaissance.com"]').forEach(function (a) {
          a.setAttribute('target', '_top');
          a.setAttribute('rel', 'noopener noreferrer');
        });
      } catch (e) {
        // ignore failures in very old browsers
        console.warn('PMR target fix failed', e);
      }
    });
  </script>
