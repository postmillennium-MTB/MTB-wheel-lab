name: Build & Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo deploys a single built index.html and keeps its buildable
      # source in wheel-lab-source.zip rather than as loose files. npm needs
      # package.json, build.js and src/ on disk, so unpack the archive into a
      # scratch directory first. Nothing is written back into the repo; the
      # archive stays the source of truth.
      - name: Unpack source archive
        run: unzip -q wheel-lab-source.zip -d build-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-src/package-lock.json

      - run: npm ci
        working-directory: build-src

      # Non-blocking on purpose. A new advisory published against a dependency
      # would otherwise turn this run red without anything in the repo having
      # changed, which trains people to ignore red. Findings still show in the
      # log and in the step's warning annotation.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: build-src
        continue-on-error: true

      - name: Build (regenerates dist/index.html from source)
        run: npm run build
        working-directory: build-src

      - name: Physics regression tests
        run: npm test
        working-directory: build-src

      - name: Smoke test (mounts the built app, clicks through every tab)
        run: npm run test:smoke
        working-directory: build-src

      # The failure this repo is actually exposed to: index.html and the source
      # archive drifting apart, because the deployed file is uploaded by hand
      # rather than generated by this workflow. A passing build proves the
      # source is sound; only this step proves the source is what is live.
      - name: Deployed index.html matches a fresh build of the source
        run: |
          if cmp -s build-src/dist/index.html index.html; then
            echo "index.html matches a fresh build of wheel-lab-source.zip."
          else
            echo "::error::index.html does not match a fresh build of wheel-lab-source.zip. Either the deployed file was edited without updating the archive, or the archive was updated without re-uploading the built file. Download the index.html artifact from this run and commit it, or fix the archive."
            ls -l build-src/dist/index.html index.html
            exit 1
          fi

      # Attached to every run, so the correct index.html is always one click
      # away when the check above fails.
      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: build-src/dist/index.html
